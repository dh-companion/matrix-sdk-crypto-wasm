name: Release patched crypto WASM

env:
  CARGO_TERM_COLOR: always

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  release:
    name: Build, test, and publish release asset
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup install stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          # Explicitly disable the store cache to prevent pollution from other workflows.
          cache: false

      # Keep this in sync with:
      # .github/workflows/ci.yml
      # .github/workflows/latest-matrix-sdk-crypto.yml
      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.0
          # Explicitly disable caching, see above.
          cache: ""
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify release version
        run: node -e 'if (`v${require("./package.json").version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'

      - name: Package release
        run: |
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
